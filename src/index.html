<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de estoque – Onion Chips</title>
<meta name="theme-color" content="#1F6B4A">
<style>
:root{--bg:#EEF2EF;--surface:#fff;--ink:#16231D;--muted:#5F7268;--line:#D3DCD6;--accent:#1F6B4A;--accent-ink:#fff;--soft:#E3EDE7;--done:#2E8B5E;--warn:#B42318;--pend:#9AA59E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A15;--surface:#17261F;--ink:#E8F0EB;--muted:#93A89B;--line:#2A3D33;--accent:#5FCB98;--accent-ink:#07210F;--soft:#1F3329;--done:#5FCB98;--warn:#FF8A7A;--pend:#6B786F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A15;--surface:#17261F;--ink:#E8F0EB;--muted:#93A89B;--line:#2A3D33;--accent:#5FCB98;--accent-ink:#07210F;--soft:#1F3329;--done:#5FCB98;--warn:#FF8A7A;--pend:#6B786F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:20px 14px 120px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.sub{margin:2px 0 16px;color:var(--muted);font-weight:600}
.hdr{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:grid;gap:12px}
.hdr .l,.l{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.hdr .mes{font-size:18px;font-weight:800}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;height:48px;padding:0 12px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.search{margin-bottom:12px}
.search input{font-size:17px}
.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.btn{height:48px;border-radius:12px;border:0;font:inherit;font-weight:800;background:var(--accent);color:var(--accent-ink);padding:0 14px}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.4}
.more{display:flex;gap:8px;margin:14px 0}
.more .btn{flex:1}
details{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px;font-size:18px;font-weight:800;min-height:56px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .cnt{font-size:14px;font-weight:600;color:var(--muted)}
summary .cnt.ok{color:var(--done)}
details>.it{margin:0 10px 10px}
.it{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--pend);border-radius:14px;overflow:hidden}
.it.done{border-left-color:var(--done)}
.it.warn{border-left-color:var(--warn)}
.ith{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 14px;min-height:56px}
.it.done .ith{cursor:pointer}
.ith .nm{flex:1;min-width:0;font-weight:800;font-size:16px}
.ith .sum{font-size:14px;font-weight:700;color:var(--done);text-align:right}
.it.warn .ith .sum{color:var(--warn)}
.warnb{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-size:18px}
.warnb[aria-pressed="true"]{background:var(--warn);color:#fff;border-color:var(--warn)}
.body{padding:0 14px 14px}
.it.done:not(.open):not(.big) .body{display:none}
.f{margin-top:10px}
.f label{display:block;font-size:15px;color:var(--muted);font-weight:600;margin-bottom:4px}
.ctl{display:flex;align-items:center;gap:8px}
.f .tx{flex:1;min-width:0;text-align:right;font-weight:600}
select{font-weight:600;width:82px;padding:0 8px}
.step{display:flex;gap:6px;align-items:center;flex:1;min-width:0}
.step button{flex:none;width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-size:26px;font-weight:600;padding:0}
.step button[data-a="p"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.step input{flex:1;min-width:0;text-align:center;font-size:20px;font-weight:800}
.qk{display:flex;gap:6px;margin-top:8px}
.qk button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-weight:800}
.addb{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;font-size:14px;padding:8px 0;min-height:36px}
.addrow{display:none;gap:8px;margin-top:4px}
.addrow.on{display:flex}
.addrow input{flex:1;min-width:0}
.addrow .btn{height:48px;padding:0 12px;white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin-top:2px}
.hint:empty{display:none}
.big .nm{font-size:24px}
.big .ith{min-height:64px}
.big .step button{width:64px;height:64px;font-size:34px}
.big .step input{height:64px;font-size:28px}
.big .tx{height:60px;font-size:20px}
.big .qk button{height:60px;font-size:20px}
.big .addrow .btn{height:56px}
.big .f label{font-size:17px}
.onebar{font-weight:800;color:var(--muted);margin:0 0 8px;text-align:center}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.nav .btn{height:60px;font-size:18px}
.empty{text-align:center;color:var(--muted);font-weight:600;padding:30px 10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar span{font-weight:700;font-size:14px;flex:1;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:grid;gap:10px}
.rv{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:6px}
.rv label{font-weight:600;display:flex;gap:8px;align-items:center}
.rv input[type=checkbox]{width:20px;height:20px;flex:none}
.rv .rvv{height:40px}
.rv small{color:var(--muted);font-size:12px;word-break:break-word}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
textarea{width:100%;height:160px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:10px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
#printSheet{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff;color:#000}
  main,.bar,.toast{display:none!important}
  #printSheet{display:block;font-family:Arial,sans-serif;color:#000}
  #printSheet h2{font-size:14pt;margin:0 0 4px}
  #printSheet p{font-size:10pt;margin:2px 0 8px}
  #printSheet table{width:100%;border-collapse:collapse;font-size:9pt}
  #printSheet th,#printSheet td{border:1px solid #000;padding:2px 4px;vertical-align:top;text-align:left}
  #printSheet td.h{background:#ddd;font-weight:bold}
  #printSheet td.c{height:20px}
  #printSheet small{font-size:7pt;color:#333}
  #printSheet tr{page-break-inside:avoid}
}
#filters{grid-template-columns:1fr 1fr 1fr}#filters button{font-size:14px;padding:0 4px}
.tabs{grid-template-columns:repeat(3,1fr);margin-bottom:14px}
.tabs button{font-size:15px;padding:0 6px}
.nv{width:100%;height:52px;font-size:17px;font-weight:600;padding:0 10px}
select.nv{width:100%}
textarea#obs{height:110px}
.ck{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;min-height:48px;border-bottom:1px solid var(--line)}
.ck input{width:24px;height:24px;flex:none}
#finalView .card .btn{width:100%;margin-top:12px}
#finalView .rv{padding:12px 0}
#finalView .rv .l{margin-top:6px}
.bar[hidden]{display:none}
.bar .btn{padding:0 12px;font-size:15px}
.lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}.lock[hidden]{display:none}.adm{justify-content:flex-start;align-items:stretch;overflow:auto;text-align:left;z-index:98}.adm>*{width:100%;max-width:560px;margin-left:auto;margin-right:auto;flex:none}.adm h2{font-size:18px;margin:8px 0 0}.lock textarea{max-width:520px}

/* ---- v12: tela de carregamento, lojas, senha e painel admin ---- */
.splash{position:fixed;inset:0;z-index:120;background:#0B0F0D;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;transition:opacity .4s}
.splash.out{opacity:0;pointer-events:none}
.spl-logo{width:min(70vw,280px);height:auto;animation:pop .6s ease-out both}
.spl-app{display:flex;align-items:center;gap:12px;color:#E8F0EB;font-weight:800;font-size:18px;animation:fade .8s .3s both}
.spl-icon{width:52px;height:52px;border-radius:14px}
.spl-dots{display:flex;gap:8px}
.spl-dots i{width:9px;height:9px;border-radius:50%;background:#5FCB98;animation:dot 1.1s infinite ease-in-out}
.spl-dots i:nth-child(2){animation-delay:.15s}
.spl-dots i:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.spl-logo,.spl-app,.spl-dots i{animation:none}}
#stores{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 18px;text-align:center}
.st-logo{width:min(60vw,220px);height:auto;border-radius:12px}
.store-card{width:100%;max-width:360px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;padding:18px;font:inherit;display:grid;gap:4px;text-align:left;cursor:pointer;min-height:84px}
.store-card .sc-ico{font-size:26px}
.store-card .sc-nome{font-size:22px;font-weight:800}
.store-card .sc-sub{font-size:14px;color:var(--muted);font-weight:600}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.topbar .btn{height:40px;padding:0 14px;font-size:15px}
.lojaTag{font-weight:800;color:var(--accent)}
.admin{position:fixed;inset:0;z-index:98;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 40px}
.admin[hidden]{display:none}
.ad-top{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:760px;margin:0 auto 10px}
.ad-top .btn{height:40px;padding:0 14px}
.ad-tabs{display:flex;gap:6px;overflow-x:auto;max-width:760px;margin:0 auto 12px;padding-bottom:4px}
.ad-tabs button{flex:none;height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-weight:700;font-size:14px}
.ad-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#admBody{max-width:760px;margin:0 auto;display:grid;gap:12px}
#admBody h2{font-size:18px;margin:6px 0 0}
#admBody select,#admBody input[type=date],#admBody input[type=number],#admBody input[type=password]{height:44px}
#admBody textarea{height:300px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.ad-table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border-radius:12px;overflow:hidden}
.ad-table th,.ad-table td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.ad-table th{font-size:12px;color:var(--muted);text-transform:uppercase}
.ad-table td.n,.ad-table th.n{text-align:right;white-space:nowrap}
.ad-wrap{overflow-x:auto}
.up{color:var(--done);font-weight:800}
.down{color:var(--warn);font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px;display:block}
.ck2{display:flex;gap:8px;align-items:center;font-weight:600;min-height:44px}
.ck2 input{width:20px;height:20px}
.pwd-sub{margin:0}
#pwd input{max-width:320px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}

</style>
</head>
<body>
<div class="splash" id="splash"><img class="spl-logo" src="assets/logo-onionchips.png" alt="Onion Chips"><div class="spl-app"><img class="spl-icon" src="assets/icon-only.png" alt=""><span>Controle de Estoque</span></div><div class="spl-dots"><i></i><i></i><i></i></div></div>
<section id="stores" hidden><img class="st-logo" src="assets/logo-onionchips.png" alt="Onion Chips"><h1>Escolha a loja</h1><p class="sub">Selecione a loja para fazer a lista</p><button class="store-card" type="button" data-store="pn"><span class="sc-ico">🏬</span><span class="sc-nome">Praça Nova</span><span class="sc-sub">Cozinha · Frente</span></button><button class="store-card" type="button" data-store="av"><span class="sc-ico">✈️</span><span class="sc-nome">Aviação</span><span class="sc-sub">Cozinha · Frente</span></button><button class="btn sec" id="admFromStores" type="button" style="max-width:360px;width:100%">🔐 Painel do administrador</button></section>
<main id="main" hidden>
  <div class="topbar"><button class="btn sec" id="sair" type="button">← Lojas</button><span class="lojaTag" id="lojaNome"></span></div>
  <div class="seg tabs" id="tabs"><button type="button" data-tab="cozinha" aria-pressed="true">Lista Cozinha</button><button type="button" data-tab="frente" aria-pressed="false">Lista Frente</button><button type="button" data-tab="final" aria-pressed="false">Final do dia</button></div>

  <div id="listView">
  <h1 id="titulo">📋 ONION CHIPS</h1>
  <p class="sub" id="sub">CONTROLE DE ESTOQUE – MENSAL</p>
  <section class="hdr" aria-label="Dados da contagem">
    <div><span class="l">📅 Mês / Ano</span><span class="mes" id="mes"></span></div>
    <div><span class="l" id="lblDia">📆 Dia da contagem</span>
      <div class="seg"><button type="button" data-dia="QUARTA" aria-pressed="false">Quarta</button><button type="button" data-dia="DOMINGO" aria-pressed="false">Domingo</button></div></div>
    <div><label class="l" for="data">📅 Data</label><input id="data" type="date"></div>
    <div><label class="l" for="resp">👤 Responsável</label><input id="resp" type="text"></div>
  </section>

  <div class="tools">
    <button class="btn sec" id="undo" type="button" disabled>↶ Desfazer</button>
    <button class="btn" id="photoBtn" type="button">📷 Ler foto</button>
    <button class="btn sec" id="printBtn" type="button">📄 PDF</button>
  </div>

  <section class="card" id="photoBox" hidden>
    <div><span class="l">📷 Ler contagem de uma foto</span>
    <input id="photoFile" type="file" accept="image/*" capture="environment"></div>
    <div><label class="l" for="photoCol">Qual coluna da folha corresponde a este dia?</label>
    <select id="photoCol" style="width:100%"><option value="1">1ª coluna</option><option value="2">2ª coluna</option><option value="3">3ª coluna</option><option value="4">4ª coluna</option></select></div>
    <p class="hint" id="photoMsg"></p>
    <div id="photoRes"></div>
    <div class="tools" style="margin:0"><button class="btn sec" id="photoClose" type="button">Fechar</button><button class="btn" id="photoApply" type="button" hidden>Aplicar marcados</button></div>
  </section>

  <div class="search"><input id="q" type="search" placeholder="🔎 Buscar produto" aria-label="Buscar produto"></div>
  <div class="seg" id="modes"><button type="button" data-mode="lista" aria-pressed="true">📋 Lista</button><button type="button" data-mode="um" aria-pressed="false">👆 Um por vez</button></div>
  <div class="seg" id="filters"><button type="button" data-f="todos" aria-pressed="true">Todos</button><button type="button" data-f="falta" aria-pressed="false">Só o que falta</button><button type="button" data-f="conf" aria-pressed="false">⚠ Conferir</button></div>

  <div id="app"><div id="cats"></div><div id="one" hidden></div></div>

  <section id="foot" class="card" hidden><label class="l" for="obs">📝 Observações / reposição</label><textarea id="obs" aria-label="Observações"></textarea></section>

  <div class="more"><button class="btn sec" id="share" type="button">Copiar</button><button class="btn sec" id="reset" type="button">Zerar</button><button class="btn sec" id="bk" type="button">Backup</button><button class="btn sec" id="admBtn" type="button">🔐 Admin</button></div>
  <div id="shareBox" hidden><textarea id="shareText" aria-label="Texto para copiar ou colar"></textarea><div class="more"><button class="btn" id="bkRestore" type="button" hidden>Restaurar deste texto</button><button class="btn sec" id="bkRec" type="button" hidden>Recuperar contagem zerada</button></div></div>
  </div>

  <div id="finalView" hidden></div>
</main>
<div class="bar" id="bar"><div><span id="prog"></span><button class="btn sec" id="cloud" type="button">☁️ Planilha</button><button class="btn" id="wa" type="button">WhatsApp</button></div></div>
<div id="printSheet"></div>
<div class="toast" id="toast" role="status"></div>
<div class="lock" id="lock" hidden></div>
<div class="admin" id="adm" hidden><div class="ad-top"><b>🔐 Painel do administrador</b><button class="btn sec" type="button" data-x="1">Sair</button></div><div class="ad-tabs" id="admTabs"></div><div id="admBody"></div></div>
<div class="lock" id="pwd" hidden></div>

function parseD(a){return a.map(function(c){return [c[0],c[1],c[2].map(function(s){var p=s.split("|");return {n:p[0],f:p.slice(1).map(function(x){var q=x.split(":");return {l:q[0],t:q[1]};})};})];});}
function defaultD(base){return parseD(base==="cozinha"?DCOZ:DFRENTE);}
function defaultText(full){return toText(defaultD(baseOf(full)));}
function baseOf(full){return full.indexOf("av-")===0?full.slice(3):full;}
function fullId(loja,base){return (loja==="av"?"av-":"")+base;}
var DEF={},SRV={};
function ensureDef(){["cozinha","frente"].forEach(function(b){DEF[b]=defaultD(b);DEF["av-"+b]=defaultD(b);});}
function lnome(full){return (full.indexOf("av-")===0?"Aviação":"Praça Nova")+" · "+LNOME[baseOf(full)];}
function toText(DD){return DD.map(function(c){return "## "+c[0]+" "+c[1]+"\n"+c[2].map(function(it){return [it.n].concat(it.f.map(function(f){return f.l+":"+f.t;})).join("|");}).join("\n");}).join("\n\n");}
function fromText(txt){
  var cats=[],cur=null;
  String(txt).split(/\r?\n/).forEach(function(raw){
    var ln=raw.trim(); if(!ln)return;
    if(ln.indexOf("## ")===0){
      var rest=ln.slice(3).trim(),sp=rest.indexOf(" ");
      if(sp<0)throw new Error("Categoria sem título: "+rest);
      cur=[rest.slice(0,sp),rest.slice(sp+1).trim(),[]];cats.push(cur);return;
    }
    if(!cur)throw new Error("Produto antes de uma categoria (comece com ## emoji Título)");
    var p=ln.split("|").map(function(x){return x.trim();});
    if(p.length<2||!p[0])throw new Error("Produto sem nome ou sem campos: "+ln);
    p.slice(1).forEach(function(f){var q=f.split(":");if(q.length!==2||!q[0].trim()||["c","d","n","x"].indexOf(q[1].trim())<0)throw new Error("Campo inválido em «"+p[0]+"»: "+f+" (use Nome:c, :d, :n ou :x)");});
    cur[2].push(p.join("|"));
  });
  if(!cats.length)throw new Error("A lista está vazia");
  cats.forEach(function(c){if(!c[2].length)throw new Error("Categoria sem produtos: "+c[1]);});
  return parseD(cats);
}
function applySrv(listas){
  var mudou=false;
  LISTAS_IDS.forEach(function(id){
    var t=listas&&listas[id];
    if(!t||SRV[id]===t)return;
    try{DEF[id]=fromText(t);SRV[id]=t;mudou=true;}catch(e){}
  });
  return mudou;
}

function calc(raw,prev){

}

function loadTess(){return new Promise(function(res,rej){
  if(window.Tesseract)return res();

  sc.src=NATIVE?"ocr/tesseract.min.js":"https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js";
  sc.onload=function(){res();};sc.onerror=function(){rej(new Error("carregar"));};

  var file=photoFile.files[0];if(!file)return;

    photoMsg.textContent="Lendo a foto… (a primeira vez pode demorar)";
    return Tesseract.recognize(file,"por",{workerPath:NATIVE?A("ocr/worker.min.js"):undefined,corePath:NATIVE?A("ocr/"):undefined,langPath:NATIVE?A("ocr/"):undefined,logger:function(m){if(m.status==="recognizing text")photoMsg.textContent="Lendo a foto… "+Math.round(m.progress*100)+"%";}});
  }).then(function(r){parsePhoto(r.data.text,col);})
  .catch(function(){photoMsg.textContent="Não consegui ler a foto. Verifique a conexão e tente de novo, ou preencha manualmente.";});
});
var A=function(p){return new URL(p,location.href).href;};
function parsePhoto(text,col){
  var skipped=0;PH=[];
  text.split(/\n/).forEach(function(line){
    var ln=" "+normName(line)+" ";if(ln.trim()==="")return;
    var best=null,bl=0;
    D.forEach(function(c,ci){c[2].forEach(function(it,ii){
      var pn=normName(it.n.split(" – ")[0].split(" (")[0]);
      if(pn.length>=3&&ln.indexOf(" "+pn+" ")>=0&&pn.length>bl){best={ci:ci,ii:ii};bl=pn.length;}
    });});
    if(!best){skipped++;return;}
    var nums=line.replace(/[A-Za-zÀ-ÿ]+/g," ").match(/\d+(?:[.,]\d+)?(?:\s*\+\s*\d+(?:[.,]\d+)?)*/g)||[];
    var e=nums[col];
    var v=e?calc(e.replace(/\s+/g,"").replace(/,/g,"."),0):null;
    if(v===null||isNaN(v)){skipped++;return;}
    PH.push({ci:best.ci,ii:best.ii,name:D[best.ci][2][best.ii].n,raw:line.trim(),val:fm(v)});
  });
  photoMsg.textContent=PH.length+" produto(s) lido(s)"+(skipped?"; "+skipped+" linha(s) sem produto ou sem valor":"")+". Confira antes de aplicar (substitui o valor atual):";
  photoRes.innerHTML=PH.map(function(x,i){return '<div class="rv"><label><input type="checkbox" checked data-i="'+i+'"> '+esc(x.name)+'</label><input class="rvv" data-i="'+i+'" inputmode="decimal" value="'+esc(x.val)+'"><small>lido: '+esc(x.raw)+'</small></div>';}).join("");
  photoApply.hidden=PH.length===0;
}
photoApply.addEventListener("click",function(){
  var n=0;
  photoRes.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    if(!cb.checked)return;
    var i=+cb.dataset.i,x=PH[i],inp=photoRes.querySelector('input.rvv[data-i="'+i+'"]');
    var v=calc(inp.value.trim().replace(/\s+/g,"").replace(/,/g,"."),0);
    if(v===null||isNaN(v)||v<0)return;
    var k=x.ci+"|"+D[x.ci][2][x.ii].n+"|0";
    setVal(k,fm(v),null);n++;
  });
  photoRes.innerHTML="";photoApply.hidden=true;photoMsg.textContent="";photoFile.value="";PH=[];
  refresh();
  toast(n+" campo(s) preenchido(s)");
});

function pwConfirmar(val){
  var p=PW;if(!p||p.busy)return;
  p.busy=true;
  var msg=document.getElementById("pwMsg");if(msg)msg.textContent="Verificando…";
  var falhou=function(texto){p.busy=false;var m=document.getElementById("pwMsg");if(m)m.textContent=texto;};

    if(!CFGOK){falhou("Falta configurar a URL da planilha (API)");return;}

      .then(function(r){return r.json();}).then(function(j){
        if(j.ok){ADM=val;fecharPw();p.cb();}
        else falhou("Senha incorreta");
      }).catch(function(){falhou("Sem conexão com a planilha");});
    return;
  }
  var cacheK="onion-senha-"+p.loja,h=hashS(val);
  var ok=function(){jset(cacheK,h);fecharPw();p.cb();};
  if(!CFGOK){if(val==="123")ok();else falhou("Senha incorreta");return;}
  fetch(API+"?chave="+enc(CHAVE)+"&acao=login&loja="+p.loja+"&senha="+enc(val)+"&t="+Date.now(),{signal:tmo(10000)})
    .then(function(r){return r.json();}).then(function(j){
      if(j.ok)ok();
      else if(j.erro==="bloqueado"){fecharPw();licenca();}
      else falhou("Senha incorreta");
    }).catch(function(){
      if(jget(cacheK,"")===h)ok();
      else falhou("Sem conexão: conecte à internet para entrar na loja");
    });

function tmo(ms){var c=new AbortController();setTimeout(function(){c.abort();},ms);return c.signal;}
function trancar(msg){
  var o={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf("onion-")===0&&!/-bak$/.test(k)&&k!==LK)o[k]=localStorage.getItem(k);}
  lockEl.innerHTML='<div style="font-size:56px">🔒</div><h1>Aplicativo bloqueado</h1><p class="sub">'+esc(msg)+'</p><p class="hint">Seus dados continuam no aparelho. Copie o texto abaixo para guardar uma cópia.</p><textarea readonly>'+esc(JSON.stringify(o))+'</textarea><button class="btn" id="lockRetry" type="button">Verificar novamente</button>';
  lockEl.hidden=false;

function licenca(cb){
  var done=function(){if(cb){var f=cb;cb=null;f();}};
  if(!CFGOK){done();return;}
  fetch(API+"?chave="+enc(CHAVE)+"&t="+Date.now(),{signal:tmo(8000)}).then(function(r){return r.json();}).then(function(j){
    jset(LK,{t:Date.now(),b:!j.ativo,m:j.msg||""});
    if(j.listas)cacheListas(j.listas);
    if(j.ativo)lockEl.hidden=true;else trancar(j.msg||"Acesso encerrado.");
    done();
  }).catch(function(){
    var s=jget(LK,null);
    if(s&&s.b)trancar(s.m||"Acesso encerrado.");
    else if(!s||Date.now()-s.t>DIAS_OFF*864e5)trancar("Conecte à internet para validar o aplicativo.");

  });

    doc.autoTable({startY:22,body:body,styles:{fontSize:8,cellPadding:1.5},columnStyles:{0:{cellWidth:65}},margin:{left:10,right:10}});
    if(CFG.foot&&S.obs)doc.text(doc.splitTextToSize("Observacoes: "+ascii(S.obs),190),10,doc.lastAutoTable.finalY+6);
    var nome="Estoque-"+STORES[ST].nome.replace(/\s+/g,"")+"-"+CFG.base+"-"+S.data+".pdf",C=window.Capacitor&&Capacitor.Plugins;
    if(NATIVE&&C&&C.Filesystem&&C.Share)return C.Filesystem.writeFile({path:nome,data:doc.output("datauristring").split(",")[1],directory:"CACHE"}).then(function(r){return C.Share.share({title:nome,url:r.uri});});

    h+='<div class="row2"><div><span class="lbl">Contagem A (anterior)</span><select id="fCmpA">'+optsContagens(cs,a)+'</select></div><div><span class="lbl">Contagem B (mais nova)</span><select id="fCmpB">'+optsContagens(cs,b)+'</select></div></div>'+

function compararRows(A,B){
  var m={},ord=[];
  A.linhas.forEach(function(x){var k=x.produto+"|"+x.campo;if(!m[k]){m[k]={p:x.produto,c:x.campo,un:x.un,cat:x.cat,a:null,b:null};ord.push(k);}m[k].a=x.qtd;});
  B.linhas.forEach(function(x){var k=x.produto+"|"+x.campo;if(!m[k]){m[k]={p:x.produto,c:x.campo,un:x.un,cat:x.cat,a:null,b:null};ord.push(k);}m[k].b=x.qtd;});
  return ord.map(function(k){return m[k];});
}
function rodarComparacao(){
  var sel=document.getElementById("fCmp"),sa=document.getElementById("fCmpA"),sb=document.getElementById("fCmpB"),so=document.getElementById("fCmpOnly");
  if(!sel||!sa||!sb)return;
  ADMF.cmp=sel.value;ADMF.cmpA=sa.value;ADMF.cmpB=sb.value;ADMF.cmpOnly=so?so.checked:false;
  var res=document.getElementById("cmpRes");
  if(ADMF.cmpA===ADMF.cmpB){res.innerHTML='<p class="hint">Escolha duas contagens diferentes.</p>';return;}
  res.innerHTML='<p class="hint">Comparando…</p>';
  Promise.all([adGet("contagem",{lista:ADMF.cmp,id:ADMF.cmpA}),adGet("contagem",{lista:ADMF.cmp,id:ADMF.cmpB})]).then(function(r){
    var A=r[0],B=r[1],rows=compararRows(A,B),only=ADMF.cmpOnly;
    var sobe=0,desce=0,igual=0;
    rows.forEach(function(x){if(typeof x.a==="number"&&typeof x.b==="number"){var d=x.b-x.a;if(d>0)sobe++;else if(d<0)desce++;else igual++;}});
    var show=rows.filter(function(x){return !only||typeof x.a!=="number"||typeof x.b!=="number"||x.b-x.a!==0;});
    var txt=["📊 *COMPARAÇÃO DE ESTOQUE – "+lnome(ADMF.cmp)+"*","A: "+rotuloC(A.info).replace(/&amp;/g,"&")+"","B: "+rotuloC(B.info).replace(/&amp;/g,"&")+"",""];
    show.forEach(function(x){
      var d=(typeof x.a==="number"&&typeof x.b==="number")?x.b-x.a:null;
      txt.push("• "+x.p+" ("+x.c+"): "+(x.a==null?"—":fm(x.a))+" → "+(x.b==null?"—":fm(x.b))+(d==null?"":" ("+(d>0?"+":"")+fm(d)+")"));
    });
    ADMF.cmpTxt=txt.join("\n");
    res.innerHTML=cardTab(esc(rotuloC(A.info))+" → "+esc(rotuloC(B.info)),
      '<div class="hint">Diferença = B − A · Subiu: '+sobe+' · Caiu: '+desce+' · Igual: '+igual+'</div>'+
      '<div class="ad-wrap"><table class="ad-table"><tr><th>Produto</th><th>Campo</th><th class="n">A</th><th class="n">B</th><th class="n">Dif.</th></tr>'+
      show.map(function(x){var d=(typeof x.a==="number"&&typeof x.b==="number")?x.b-x.a:null;return '<tr><td>'+esc(x.p)+'</td><td>'+esc(x.c)+'</td><td class="n">'+vv(x.a)+'</td><td class="n">'+vv(x.b)+'</td><td class="n">'+(d==null?"—":difTxt(d))+'</td></tr>';}).join("")+
      '</table></div><div class="more" style="margin:0"><button class="btn sec" type="button" data-adm="cmpShare">📤 Enviar relatório</button></div>');
  }).catch(erroAd);
}

    '<p class="hint">Consumo = quanto saiu do estoque entre uma contagem e a seguinte (vendas + desperdício). Reposição = quanto entrou.</p>'+
    '<div><span class="lbl">Lista</span>'+selLista("fCs",ADMF.cs)+'</div>'+
    '<div class="row2"><div><span class="lbl">De</span><input type="date" id="fIni" value="'+(ADMF.ini||inicioMes())+'"></div><div><span class="lbl">Até</span><input type="date" id="fFim" value="'+(ADMF.fim||today())+'"></div></div>'+
    '<div class="more" style="margin:0"><button class="btn" type="button" data-adm="consumo">📉 Consultar período</button></div><div id="conRes"></div>';
  return Promise.resolve();
}
function rodarConsumo(){
  var lst=document.getElementById("fCs").value,de=document.getElementById("fIni").value,ate=document.getElementById("fFim").value;
  if(!de||!ate||de>ate){toast("Confira as datas");return;}
  ADMF.cs=lst;ADMF.ini=de;ADMF.fim=ate;
  var res=document.getElementById("conRes");res.innerHTML='<p class="hint">Consultando…</p>';
  adGet("consumo",{lista:lst,de:de,ate:ate}).then(function(j){
    var rows=j.linhas,tot=0;
    rows.forEach(function(x){tot+=x.consumo;});
    var txt=["📉 *CONSUMO – "+lnome(lst)+"*","Período: "+de.split("-").reverse().join("/")+" a "+ate.split("-").reverse().join("/"),""];
    rows.forEach(function(x){txt.push("• "+x.produto+" ("+x.campo+"): saiu "+fm(x.consumo)+" "+x.un+(x.reposicao?", entrou "+fm(x.reposicao)+" "+x.un:""));});
    ADMF.conTxt=txt.join("\n");
    res.innerHTML=cardTab("Consumo de "+esc(de.split("-").reverse().join("/"))+" a "+esc(ate.split("-").reverse().join("/")),
      (rows.length?'<div class="ad-wrap"><table class="ad-table"><tr><th>Produto</th><th>Campo</th><th class="n">Consumo</th><th class="n">Reposição</th><th class="n">Contagens</th></tr>'+
      rows.map(function(x){return '<tr><td>'+esc(x.produto)+'</td><td>'+esc(x.campo)+'</td><td class="n down">'+fm(x.consumo)+' '+esc(x.un)+'</td><td class="n up">'+(x.reposicao?fm(x.reposicao)+" "+esc(x.un):"—")+'</td><td class="n">'+x.contagens+'</td></tr>';}).join("")+
      '</table></div>':'<p class="hint">Sem contagens com números neste período.</p>')+
      (rows.length?'<div class="more" style="margin:0"><button class="btn sec" type="button" data-adm="conShare">📤 Enviar consumo</button></div>':''));
  }).catch(erroAd);
}

// Mínimos (todas as listas)
function tabMinimos(){
  return adGet("painel",{}).then(function(j){
    ADMJ=j;
    var mp={};j.minimos.forEach(function(m){mp[m[0]+"|"+m[1]+"|"+m[2]]=m;});
    var h='<p class="hint">Preencha só o que quer monitorar. Cada campo (fechado, aberto…) tem o seu mínimo. Vazio = sem mínimo.</p>';
    LISTAS_IDS.forEach(function(l){
      h+='<h2>'+esc(lnome(l))+'</h2>';
      DEF[l].forEach(function(c){
        h+='<details><summary><span>'+c[0]+" "+esc(c[1])+'</span></summary><div style="padding:0 12px 12px">';
        c[2].forEach(function(it){it.f.forEach(function(f){
          if(f.t==="n"||f.t==="x")return;
          var cp=fl(f.l),m=mp[l+"|"+it.n+"|"+cp]||["","","","",""],un=m[4]||dunit(f.l);
          h+='<div class="rv"><span class="l">'+esc(it.n+" – "+cp)+'</span><div class="ctl"><input class="tx" inputmode="decimal" placeholder="mín." data-ml="'+l+'" data-mp="'+esc(it.n)+'" data-mc="'+esc(cp)+'" value="'+(m[3]===""?"":fm(Number(m[3])))+'"><select>'+UN.map(function(u){return "<option"+(u===un?" selected":"")+">"+u+"</option>";}).join("")+'</select></div></div>';
        });});
        h+='</div></details>';
      });
    });
    h+='<div class="more" style="margin:0"><button class="btn" type="button" data-adm="saveMin">💾 Salvar mínimos</button></div>';
    document.getElementById("admBody").innerHTML=h;
  });
}
function salvarMinimos(){
  var rows=[];
  document.querySelectorAll("#admBody input[data-ml]").forEach(function(i){
    var v=i.value.trim().replace(",",".");
    if(v===""||isNaN(Number(v))||Number(v)<0)return;
    rows.push([i.dataset.ml,i.dataset.mp,i.dataset.mc,Number(v),i.nextElementSibling.value]);
  });
  toast("Salvando…");
  adPost({acao:"minimos",lista:rows}).then(function(j){toast("Mínimos salvos ✓ ("+rows.length+")");ADMJ=j;}).catch(erroAd);
}

// Editar listas de produtos
function tabListas(){
  var l=ADMF.lst;
  document.getElementById("admBody").innerHTML=
    '<div><span class="lbl">Lista</span>'+selLista("fLst",l)+'</div>'+
    '<p class="hint">Uma categoria por linha: <b>## emoji Título</b>. Cada produto em uma linha: <b>Nome|Campo:tipo|Campo:tipo</b>. Tipos: <b>c</b> = contagem com + e −; <b>d</b> = decimal; <b>n</b> = nível (Cheio… Vazio); <b>x</b> = texto livre. Renomear um produto zera a contagem dele no app (o histórico na planilha continua).</p>'+
    '<textarea id="fTxt" spellcheck="false">'+esc(toText(DEF[l]))+'</textarea>'+
    '<div class="row2"><button class="btn sec" type="button" data-adm="lstCheck">✔ Validar</button><button class="btn" type="button" data-adm="lstSave">💾 Salvar lista</button></div>'+
    '<button class="btn sec" type="button" data-adm="lstReset">↺ Restaurar padrão desta lista</button>';
  return Promise.resolve();
}
function lstSave(texto){
  var full=ADMF.lst,DDn;
  try{DDn=fromText(texto);}catch(e){toast(e.message);return Promise.resolve();}
  var norm=toText(DDn);
  return adPost({acao:"salvar_lista",lista:full,texto:norm}).then(function(){
    SRV[full]=norm;DEF[full]=DDn;
    toast("Lista salva ✓");
    if(ST&&CFG&&CFG.id===full&&TAB!=="final")setList(TAB);
    admRender();
  }).catch(erroAd);
}

// Configurações
function tabConfig(){
  return adGet("painel",{}).then(function(j){
    ADMJ=j;
    document.getElementById("admBody").innerHTML=
      cardTab("🔑 Senhas das lojas","<p class=\"hint\">Senha para abrir a loja e fazer a lista. Padrão: 123. Mínimo de 3 caracteres.</p>"+
        ["pn","av"].map(function(s){return '<div class="rv"><span class="l">'+STORES[s].ico+" "+esc(STORES[s].nome)+'</span><div class="ctl"><input id="np_'+s+'" type="password" inputmode="numeric" placeholder="Nova senha" autocomplete="new-password" style="flex:1"><button class="btn" type="button" data-adm="senha" data-loja="'+s+'">Trocar</button></div></div>';}).join(""))+
      cardTab("🚨 Alerta “perto do mínimo”","<p class=\"hint\">Quando a quantidade fica a até este % acima do mínimo, o item aparece como “perto do mínimo”.</p><div class=\"ctl\"><input id=\"fPct\" type=\"number\" inputmode=\"numeric\" min=\"0\" max=\"100\" value=\""+esc(j.pct)+"\" style=\"width:120px\"><span>%</span><button class=\"btn\" type=\"button\" data-adm=\"pct\">Salvar</button></div>")+
      cardTab("🔒 Bloqueio do app","<p class=\"hint\">Para bloquear ou liberar o app em todos os aparelhos, mude a célula B1 da aba Config na planilha (SIM ou NAO).</p>");
  });
}
function trocarSenha(loja){
  var v=document.getElementById("np_"+loja).value.trim();
  if(v.length<3){toast("Use pelo menos 3 caracteres");return;}
  adPost({acao:"senha",loja:loja,nova:v}).then(function(){
    toast("Senha da "+STORES[loja].nome+" trocada ✓");
    document.getElementById("np_"+loja).value="";
    try{localStorage.removeItem("onion-senha-"+loja);}catch(e){}
  }).catch(erroAd);
}
function salvarPct(){
  var v=Number(document.getElementById("fPct").value);
  if(isNaN(v)||v<0||v>100){toast("Use um número de 0 a 100");return;}
  adPost({acao:"alerta",pct:v}).then(function(){toast("Alerta salvo ✓");}).catch(erroAd);
}

var admEl=document.getElementById("adm");
admEl.addEventListener("click",function(e){
  var t=e.target.closest("[data-at],[data-adm],[data-ct],[data-x]");if(!t)return;
  if(t.dataset.at){ADMTAB=t.dataset.at;desenharTabs();admRender();return;}
  if(t.dataset.x!==undefined){fecharAdmin();return;}
  var a=t.dataset.adm,c=t.dataset.ct;
  if(a==="ref")return admRender();
  if(a==="buy")return listaCompras();
  if(a==="cmp")return rodarComparacao();
  if(a==="cmpShare")return compartilhar(ADMF.cmpTxt||"");
  if(a==="consumo")return rodarConsumo();
  if(a==="conShare")return compartilhar(ADMF.conTxt||"");
  if(a==="saveMin")return salvarMinimos();
  if(a==="lstCheck"){try{var d=fromText(document.getElementById("fTxt").value);var n=0;d.forEach(function(x){n+=x[2].length;});toast("Lista OK: "+d.length+" categorias, "+n+" produtos");}catch(err){toast(err.message);}return;}
  if(a==="lstSave")return lstSave(document.getElementById("fTxt").value);
  if(a==="lstReset"){if(confirm("Voltar esta lista ao padrão original? As alterações feitas pelo admin serão perdidas."))return lstSave(defaultText(ADMF.lst));return;}
  if(a==="senha")return trocarSenha(t.dataset.loja);
  if(a==="pct")return salvarPct();
  if(c==="ver")return ctVer(t.dataset.id).catch(erroAd);
  if(c==="del")return ctDel(t.dataset.id);
  if(c==="salvar")return ctSalvar();
  if(c==="voltar")return admRender();
});
admEl.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="fAlerta"){ADMF.alertas=e.target.value;admRender();}
  else if(id==="fCmp"){ADMF.cmp=e.target.value;ADMF.cmpA="";ADMF.cmpB="";admRender();}
  else if(id==="fCmpA"||id==="fCmpB"||id==="fCmpOnly"){rodarComparacao();}
  else if(id==="fCt"){ADMF.ct=e.target.value;admRender();}
  else if(id==="fCs"){ADMF.cs=e.target.value;}
  else if(id==="fLst"){ADMF.lst=e.target.value;admRender();}
});

// ---------- Inicialização ----------
function init(){
  ensureDef();
  var c=jget("onion-cfgcache",null);if(c&&c.listas)applySrv(c.listas);
  var spl=document.getElementById("splash"),okA=false,okB=false,feito=false;
  function fim(){
    if(feito||!okA||!okB)return;
    feito=true;
    spl.classList.add("out");
    setTimeout(function(){spl.hidden=true;},450);
    mostrarLojas();
  }
  setTimeout(function(){okA=true;fim();},2200);
  licenca(function(){okB=true;fim();});
  filaEnviar();badge();
}
init();
})();

</script>
